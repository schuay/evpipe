[project]
name = "evpipe"
version = "0.1.0"
description = "Linux-to-Linux keyboard/mouse forwarding over ssh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "evdev>=1.6",
    "pyudev>=0.24",
]

[project.scripts]
evpipe-send = "evpipe.send:main"
evpipe-recv = "evpipe.recv:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evpipe"]
