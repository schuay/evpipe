[project]
name = "evpipe"
version = "0.1.0"
description = "Linux-to-Linux keyboard/mouse forwarding over ssh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "evdev>=1.6",
    "pyudev>=0.24",
]

[project.scripts]
evpipe-send = "evpipe.send:main"
evpipe-recv = "evpipe.recv:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Always use a uv-downloaded python-build-standalone interpreter; never
# fall back to a system python3 (and the apt-managed headers that go
# with it). Combined with .python-version, every fresh checkout gets
# the same 3.11 regardless of what the host distro ships.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evpipe"]
